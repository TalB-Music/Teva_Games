<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controller Check</title>
<style>
  body { margin: 0; padding: 24px; background: #E6FAFF; color: #20324A; font: 18px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  h2 { margin: 24px 0 4px; font-size: 18px; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .b { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: #fff; font-weight: 700; }
  .b.on { background: #FF5D87; color: #fff; }
  .a { min-width: 76px; padding: 4px 8px; border-radius: 8px; background: #fff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Controller check</h1>
<p id="status">Press any button on the controller. Chrome only shows a controller after a button is pressed.</p>
<div id="pads"></div>
<h2>Direct connection</h2>
<p>If nothing appears above, connect here, choose the controller in Chrome's list, then press buttons.</p>
<button id="connect">Connect controller</button>
<p id="hid-status">Not connected.</p>
<p id="hid-report" style="font: 700 28px/1.2 system-ui, sans-serif">Report: none yet</p>
<p id="hid-bytes" style="font-family: ui-monospace, monospace; overflow-wrap: anywhere"></p>
<p id="hid-moving" style="font-family: ui-monospace, monospace; overflow-wrap: anywhere; white-space: pre-line"></p>
<script>
  const hidMoving = document.getElementById('hid-moving');
  const hidStatus = document.getElementById('hid-status');
  const hidReport = document.getElementById('hid-report');
  const hidBytes = document.getElementById('hid-bytes');
  document.getElementById('connect').addEventListener('click', async () => {
    if (!navigator.hid) {
      hidStatus.textContent = 'This browser has no direct connection. Use Chrome on a computer.';
      return;
    }
    try {
      const [device] = await navigator.hid.requestDevice({
        filters: [{ vendorId: 0x057e }, { usagePage: 1, usage: 4 }, { usagePage: 1, usage: 5 }],
      });
      if (!device) {
        hidStatus.textContent = 'Nothing chosen. Press Connect controller to try again.';
        return;
      }
      if (!device.opened) await device.open();
      hidStatus.textContent = `Connected to ${device.productName}. Press buttons now.`;
      let count = 0;
      const started = performance.now();
      const perReport = {};
      device.addEventListener('inputreport', (e) => {
        count++;
        const bytes = [...new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength)];
        const hex = bytes.map((b) => b.toString(16).padStart(2, '0')).join(' ');
        const id = e.reportId.toString(16).toUpperCase();
        hidReport.textContent = `Report: ${id} (${count} received)`;
        hidBytes.textContent = hex;
        const seen = (perReport[id] = perReport[id] || { count: 0, low: bytes.slice(), high: bytes.slice() });
        seen.count++;
        bytes.forEach((b, i) => {
          seen.low[i] = Math.min(seen.low[i], b);
          seen.high[i] = Math.max(seen.high[i], b);
        });
        const seconds = Math.max(1, (performance.now() - started) / 1000);
        hidMoving.textContent = Object.entries(perReport).map(([name, r]) => {
          const moving = r.low.map((low, i) => (low === r.high[i] ? null : `byte ${i}: ${low.toString(16)}-${r.high[i].toString(16)}`)).filter(Boolean);
          return `Report ${name}: ${(r.count / seconds).toFixed(1)} per second, changing: ${moving.join(', ') || 'nothing'}`;
        }).join('\n');
      });
    } catch (err) {
      hidStatus.textContent = `Couldn't connect: ${err.message}`;
    }
  });
</script>
<script>
  const pads = document.getElementById('pads');
  const status = document.getElementById('status');
  function draw() {
    const list = [...navigator.getGamepads()].filter(Boolean);
    if (list.length) status.textContent = 'Found ' + list.length + '. Press buttons to see which number lights up.';
    pads.innerHTML = list.map((p) => `
      <h2>${p.id}</h2>
      <p>Layout: ${p.mapping || 'non-standard'}</p>
      <div class="row">${p.buttons.map((b, i) => `<div class="b ${b.pressed ? 'on' : ''}">${i}</div>`).join('')}</div>
      <p class="row">${[...p.axes].map((a, i) => `<span class="a">axis ${i}: ${a.toFixed(2)}</span>`).join('')}</p>`).join('');
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
