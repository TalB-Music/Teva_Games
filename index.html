<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8FDFFF">
<meta name="mobile-web-app-capable" content="yes">
<title>Teva Games</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/world.css">
<style>
  @font-face { font-family: Chango; src: url(assets/fonts/chango-latin.woff2) format("woff2"); font-display: swap; }
  #title {
    position: fixed;
    z-index: 5;
    top: calc(5vh + env(safe-area-inset-top));
    left: 0;
    right: 0;
    margin: 0;
    text-align: center;
    font: 400 clamp(64px, min(22vw, 18vh), 170px)/1 Chango, "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
    color: #FF5D87;
    -webkit-text-stroke: 3px #fff;
    paint-order: stroke fill;
    text-shadow: 0 6px 0 #fff;
    pointer-events: none;
  }
  .sun, .cloud-a { display: none; }
  #title span { display: inline-block; }
  #title span:nth-child(odd) { transform: translateY(5px) rotate(-5deg); }
  #title span:nth-child(even) { transform: translateY(-4px) rotate(4deg); }

  #nest {
    position: fixed;
    z-index: 10;
    left: 0;
    right: 0;
    bottom: calc(4vh + env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas: "main main" "egg1 egg2";
    justify-items: center;
    align-items: end;
    gap: 2vh 4vw;
    padding: 0 6vw;
  }
  .slot { position: relative; display: block; }
  .slot:focus-visible { outline: none; }
  .slot.game { grid-area: main; width: min(82vw, 50vh); }
  .slot.soon { width: min(30vw, 18vh); }
  .slot.soon:nth-of-type(2) { grid-area: egg1; }
  .slot.soon:nth-of-type(3) { grid-area: egg2; }
  .slot svg { height: auto; filter: drop-shadow(0 8px 0 rgb(32 50 74 / .14)); }
  .slot.selected::after {
    content: "";
    position: absolute;
    inset: -4%;
    border-radius: 50%;
    border: 7px dashed #fff;
    animation: spin 8s linear infinite;
  }

  @media (orientation: landscape) {
    #title { top: calc(2vh + env(safe-area-inset-top)); font-size: clamp(48px, 19vh, 150px); }
    #nest {
      grid-template-columns: 1fr auto 1fr;
      grid-template-areas: "egg1 main egg2";
      bottom: calc(3vh + env(safe-area-inset-bottom));
      gap: 3vw;
    }
    .slot.game { width: min(40vw, 70vh); }
    .slot.soon { width: min(18vw, 30vh); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1 id="title" aria-label="Teva"><span>T</span><span>e</span><span>v</span><span>a</span></h1>
<nav id="nest" aria-label="Games"></nav>

<script src="shared/audio.js"></script>
<script src="shared/input.js"></script>
<script src="shared/art.js"></script>
<script src="shared/games.js"></script>
<script>
(function () {
  const T = window.Teva;
  T.addScene();
  const nest = document.getElementById('nest');
  const slots = [];

  T.games.forEach((game) => {
    const btn = document.createElement('button');
    btn.className = 'slot game';
    btn.setAttribute('aria-label', game.name);
    btn.innerHTML = T.art[game.art]();
    btn.activate = () => {
      T.audio.chirp();
      const r = btn.getBoundingClientRect();
      T.fx.burst('heart', r.left + r.width / 2, r.top + r.height / 3, 8, 54, 220);
      btn.animate(
        [{ transform: 'none' }, { transform: 'translateY(-16%) scale(1.04,.96)' }, { transform: 'none' }],
        { duration: 420, easing: 'ease-out' }
      ).onfinish = () => location.assign(game.href);
    };
    nest.appendChild(btn);
    slots.push(btn);
  });

  T.comingSoonEggs.forEach((colors) => {
    const btn = document.createElement('button');
    btn.className = 'slot soon';
    btn.setAttribute('aria-label', 'A game that has not hatched yet');
    btn.innerHTML = T.art.egg(colors);
    btn.activate = () => {
      T.audio.giggle();
      btn.animate(
        [0, -12, 12, -9, 9, -4, 0].map((deg) => ({ transform: `rotate(${deg}deg)` })),
        { duration: 620, easing: 'ease-in-out' }
      );
      const r = btn.getBoundingClientRect();
      T.fx.burst('star', r.left + r.width / 2, r.top + r.height / 3, 4, 34, 130);
    };
    nest.appendChild(btn);
    slots.push(btn);
  });

  slots.forEach((btn) => btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    select(null);
    btn.activate();
  }));

  // Left to right on screen, whatever order the grid puts them in.
  const order = () => slots.slice().sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
  let selected = null;
  function select(btn) {
    slots.forEach((s) => s.classList.toggle('selected', s === btn));
    selected = btn;
  }
  function move(step) {
    const row = order();
    const at = selected ? row.indexOf(selected) : row.indexOf(slots[0]) - step;
    select(row[(at + step + row.length) % row.length]);
    T.audio.hop();
  }
  const press = () => (selected || slots[0]).activate();

  T.input.listen({
    direction(d) { if (d.x) move(d.x); },
    button: press,
    key(k) { if (k === 'Enter' || k === ' ') press(); },
  });
})();
</script>
</body>
</html>
