# Builds the Android APK and publishes it as a release.
# The signing key is the KEYSTORE_BASE64 repository secret, never a file in this
# public repo. It stays the same so every new APK installs over the previous one.
# Without the secret the build still works, but each APK gets a throwaway key.
# Put [skip ci] in a commit message to skip a build.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'shared/**'
      - 'games/**'
      - 'assets/**'
      - 'native/**'
      - 'tools/build-www.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::No KEYSTORE_BASE64 secret, so this APK won't install over earlier ones."
          fi

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Gather the web app
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Add native code
        run: cp native/*.java android/app/src/main/java/com/talmusictech/tevagames/

      - name: Set the app version
        run: |
          G=android/app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/' "$G"
          sed -i -E 's/versionName "[^"]*"/versionName "0.1.${{ github.run_number }}"/' "$G"
          grep -E 'versionCode|versionName' "$G"

      - name: App icon and splash screen
        run: npx --yes @capacitor/assets generate --android

      - name: Copy the web app in
        run: npx cap sync android

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk teva-games.apk

      - name: Publish a release with the APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Teva Games build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: teva-games.apk
          make_latest: true
